specification: API Commons Packages
specificationVersion: '0.1'
provider: F5
providerId: f5
generated: '2026-09-07'
method: searched
source: >-
  Registry metadata endpoints queried unauthenticated on 2026-09-07 — pypi.org/pypi/<pkg>/json,
  registry.npmjs.org/<pkg>, registry.terraform.io/v1/providers/<ns>/<name>,
  galaxy.ansible.com/api/v3/.../collections/index/f5networks/<name>/, proxy.golang.org/<mod>/@latest,
  hub.docker.com/v2/repositories/<repo>/ — cross-referenced against the F5Networks, f5devcentral and
  nginx GitHub organizations.
description: >-
  First-party F5 client libraries, providers, collections and images. F5's distribution centre of
  gravity is infrastructure-as-code and operator tooling — Terraform providers, Ansible collections
  and Kubernetes controllers are current and actively released, while the classic Python SDKs for
  iControl REST were last published in 2019 and are effectively frozen. That split is the single
  most useful currency signal in this record: an agent integrating with BIG-IP through the Python
  SDK is picking up a library that has not shipped in seven years, while the same platform's
  Terraform provider shipped two months ago.
package_count: 13
official_count: 13
findings:
  - The two Python SDKs F5 published for iControl REST (f5-sdk / f5-common-python and
    f5-icontrol-rest) both last released in April 2019. The API they wrap is still shipping.
  - f5-cli, F5's own command-line client on PyPI, last released 2020-04-16 and its GitHub
    repository (F5Networks/f5-cli) now returns 404 — the package outlives its source.
  - >-
    Terraform, Ansible and container distribution are current — bigip 1.28.0 (2026-07-02),
    f5os 1.13.0 (2026-08-19), f5networks.f5_modules 1.43.0 (2026-08-11),
    f5networks.f5os 1.23.0 (2026-08-25), nginx/nginx-ingress image updated 2026-09-07.
  - The Volterra (F5 Distributed Cloud) Terraform provider is published under the volterraedge
    namespace, not F5Networks — a legacy of the 2021 Volterra acquisition. F5's own XC
    documentation points at it, which is why it is marked official here.
