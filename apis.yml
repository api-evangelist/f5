apis:
- aid: f5:f5-big-ip
  name: F5 BIG-IP
  description: >-
    BIG-IP delivers high-performance application and API delivery with load balancing, API gateway, DNS,
    and security services. The platform exposes programmable APIs including iControlREST for configuration
    and service management, iControl SOAP for legacy automation, iRules and iRulesLX for data-plane traffic
    manipulation, and TMSH scripting for control-plane automation. BIG-IQ provides centralized management
    for BIG-IP devices through its own well-documented REST API.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://clouddocs.f5.com/api/
  tags:
  - Applications
  - Security
  - Load Balancing
  - BIG-IP
  properties:
  - type: Documentation
    url: https://clouddocs.f5.com/api/
  - type: iControlREST
    url: https://clouddocs.f5.com/api/icontrol-rest/
  - type: BIG-IQ Management API
    url: https://clouddocs.f5.com/products/big-iq/mgmt-api/v0.0/
  - type: iRules
    url: https://clouddocs.f5.com/api/irules/
  - type: iApps
    url: https://clouddocs.f5.com/api/iapps/
- aid: f5:f5-nginx
  name: F5 NGINX
  description: >-
    NGINX provides cloud-native delivery and security for modern applications, Kubernetes, and APIs. The
    NGINX product line includes NGINX Plus, NGINX One, NGINX Ingress Controller, and NGINX App Protect,
    with management and automation capabilities exposed through REST APIs for instance management, configuration,
    and observability across distributed deployments.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.nginx.com/
