- aid: f5:f5-mgmt-api
  name: F5 BIG-IP iControl REST (Mgmt)
  description: >-
    A partial contract for the BIG-IP iControl REST management tree — 10 paths under /mgmt/tm/ and /mgmt/shared/
    covering token login, virtual servers, pools, pool members, nodes, HTTP profiles and system version.
    iControl REST addresses the whole TMSH-addressable configuration tree, so this covers a small fraction
    of the real surface; F5 publishes no complete OpenAPI for it.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://clouddocs.f5.com/api/icontrol-rest/
