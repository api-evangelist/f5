- aid: f5:f5-big-ip-fast
  name: F5 BIG-IP Application Services Templates (FAST)
  description: 'FAST is the templating layer over AS3 — 26 operations over /mgmt/shared/fast for template sets, templates, applications, tasks and settings. It is the most agent-friendly F5 API in the estate for one specific reason: GET /templates/{setName}/{templateName} returns a real machine-readable parameter schema, and POST /render returns the AS3 declaration a set of parameters WOULD produce without deploying it, so an integration has both an input contract and a rehearsal step.'
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
