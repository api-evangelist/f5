- aid: f5:f5-big-ip-declarative-onboarding
  name: F5 BIG-IP Declarative Onboarding
  description: 'Declarative Onboarding sets up the BIG-IP device itself — hostname, licensing, DNS and NTP, VLANs, self-IPs, routes, user accounts and module provisioning — from a single declaration. 9 operations over /mgmt/shared/declarative-onboarding. It is the layer beneath AS3 and the highest-consequence write surface F5 publishes: there is no dry-run mode, a 200 on POST does not mean the declaration succeeded (the outcome is on the task), and a declaration can restart services and change the management addressing you are calling it on. DO does store the device''s original pre-onboarding configuration and will return it from GET /config/{machineId}.'
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://clouddocs.f5.com/products/extensions/f5-declarative-onboarding/latest/
  baseURL: https://{bigip}/mgmt/shared/declarative-onboarding
