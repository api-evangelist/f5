- aid: f5:f5-distributed-cloud
  name: F5 Distributed Cloud Services
  description: >-
    F5 Distributed Cloud Services delivers SaaS-based application delivery, security, and networking across
    multicloud and edge environments. The platform exposes a comprehensive REST API for managing tenants,
    virtual sites, load balancers, WAF policies, bot defense, API security, DDoS protection, and CDN configurations
    from a single control plane.
