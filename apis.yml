apis:
- aid: f5:f5-big-ip
  name: F5 BIG-IP
  description: >-
    BIG-IP delivers high-performance application and API delivery with load balancing, API gateway, DNS,
    and security services. The platform exposes programmable APIs including iControlREST for configuration
    and service management, iControl SOAP for legacy automation, iRules and iRulesLX for data-plane traffic
    manipulation, and TMSH scripting for control-plane automation. BIG-IQ provides centralized management
    for BIG-IP devices through its own well-documented REST API.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://clouddocs.f5.com/api/
  baseURL: https://{bigip}/mgmt
