- aid: f5:f5-nginx-plus-api
  name: NGINX Plus REST API
  description: The NGINX Plus REST API — 71 operations across 24 paths giving live status for processes, connections, workers, slabs, resolvers, SSL and the licence, plus runtime reconfiguration of HTTP and stream upstream groups and key-value stores, with no reload. Published by F5 as a Swagger 2.0 document, versioned in the nginx/nginx.org repository and served from F5's own NGINX demo host. It is the metrics and runtime-control plane of NGINX Plus, served by the customer's own instance; access control and write mode are nginx.conf decisions, not F5's.
