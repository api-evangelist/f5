- aid: f5:f5-big-ip-as3
  name: F5 BIG-IP AS3 (Application Services 3 Extension)
  description: 'AS3 is BIG-IP''s declarative application-services API — one document describes tenants, applications, virtual servers, pools, monitors, profiles and WAF policies, and AS3 converges the device to it. 13 operations over /mgmt/shared/appsvcs. Two properties make it unusually good for automation: controls.dryRun runs the full validation chain without touching the device (and is wired to the delete path as well as create), and GET /declare?age=0-15 keeps a bounded history of prior declarations that can be re-deployed as an undo. The declaration body itself is governed by a separately published JSON Schema, not by this OpenAPI, and no operation in the contract declares an operationId.'
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://clouddocs.f5.com/products/extensions/f5-appsvcs-extension/latest/
  baseURL: https://{bigip}/mgmt/shared/appsvcs
  tags:
