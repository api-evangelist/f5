specification: API Commons ErrorCatalog
specificationVersion: '0.1'
provider: F5
providerId: f5
generated: '2026-09-07'
method: derived
source: >-
  Derived from the 4xx/5xx responses declared in the four first-party F5 contracts harvested into
  openapi/ on 2026-09-07 — NGINX Plus REST API 9.0, BIG-IP AS3 3.56.0, BIG-IP FAST 1.26.0 and
  BIG-IP Declarative Onboarding 1.47.0 — enriched from the NGINX Plus API error reference at
  https://nginx.org/en/docs/http/ngx_http_api_module.html
description: >-
  F5's error surface is not one catalogue but two, and they behave differently. The NGINX Plus REST
  API ships a genuine machine-readable error taxonomy — a stable envelope carrying an internal
  `error.code` string enumerated per operation in the spec itself, plus a `request_id` that
  correlates to NGINX's own $request_id log variable and an `href` back to the documentation. The
  BIG-IP Automation Toolchain APIs (AS3, FAST, DO) declare status codes and prose descriptions but
  no enumerated code vocabulary and no envelope schema, so an agent handling them has status codes
  and a message string and nothing else to branch on.
format: vendor-specific
rfc9457: false
rfc9457_note: >-
  No F5 contract declares application/problem+json. The NGINX Plus envelope predates RFC 9457 and
  carries the same information under different field names (error.status rather than status,
  error.text rather than detail, href rather than type).
envelopes:
  - api: NGINX Plus REST API
    spec: openapi/f5-nginx-plus-api-openapi.yml
    schema: '#/definitions/NginxError'
    content_type: application/json
    fields:
      - name: error.code
        type: string
        description: Internal NGINX error code — the branchable identifier. Enumerated per operation.
      - name: error.status
        type: integer
        description: HTTP status code, repeated inside the body.
      - name: error.text
        type: string
        description: Human-readable error description.
      - name: request_id
        type: string
        description: Correlation ID; equals NGINX's $request_id variable, so a client error can be
          joined to the server access log line that produced it.
      - name: href
        type: string
        description: Link to the reference documentation for the failing surface.
  - api: F5 BIG-IP AS3
    spec: openapi/f5-big-ip-as3-openapi.yml
    schema: null
    content_type: application/json
    note: Declares 404, 422, 500 and 503 with prose descriptions; no response schema and no error
      code vocabulary is declared in the contract.
  - api: F5 BIG-IP FAST
    spec: openapi/f5-big-ip-fast-openapi.yml
    schema: null
    content_type: application/json
    note: Declares 400, 404, 422 and 500; the 422 responses carry validation messages but no code
      vocabulary is declared in the contract.
  - api: F5 BIG-IP Declarative Onboarding
    spec: openapi/f5-big-ip-declarative-onboarding-openapi.yml
    schema: null
    content_type: application/json
    note: Declares 404, 422 and 500. DO reports per-task status inside the 200 body as well, so a
      2xx from POST / does not mean the declaration succeeded — read result.code on the task.
status_code_counts:
  f5-nginx-plus-api-openapi.yml:
    '400': 18
    '404': 71
    '405': 29
    '409': 4
    '413': 4
    '415': 8
  f5-big-ip-as3-openapi.yml:
    '404': 1
