problem_types:
  - code: UnknownVersion
    status: 404
    api: NGINX Plus REST API
    title: Unknown API version
    detail: The /api/{version} prefix names a version this NGINX Plus build does not implement.
    remediation: GET / on the API root to read the array of supported version numbers, then retry
      against a version it returns.
  - code: MethodDisabled
    status: 405
    api: NGINX Plus REST API
    title: Method disabled
    detail: The write methods (POST/PATCH/DELETE) are refused because the api directive is not in
      write mode for this location.
    remediation: Set `api write=on;` in the NGINX configuration location that serves the API, then
      reload. Read-only deployments will always return this for mutations by design.
  - code: UpstreamStatic
    status: 400
    api: NGINX Plus REST API
    title: Upstream is static
    detail: The upstream group was configured statically, so its server list cannot be changed at
      runtime through the API.
    remediation: Declare the upstream with a `zone` directive and use the `state` file or resolver
      form so its members are dynamically configurable.
  - code: UpstreamNotFound
    status: 404
    api: NGINX Plus REST API
    title: Upstream not found
    detail: No upstream group with that name exists in the running configuration.
  - code: UpstreamServerNotFound
    status: 404
    api: NGINX Plus REST API
    title: Upstream server not found
    detail: No server with the supplied numeric ID exists in the named upstream.
    remediation: GET the servers collection first; server IDs are assigned by NGINX and are not
      stable across a configuration reload.
  - code: UpstreamServerImmutable
    status: 400
    api: NGINX Plus REST API
    title: Upstream server is immutable
    detail: The server was defined statically in the configuration file and its address cannot be
      changed or removed through the API.
  - code: UpstreamServerWeightImmutable
    status: 400
    api: NGINX Plus REST API
    title: Upstream server weight is immutable
    detail: The weight of a service-resolved (SRV) upstream server is derived from DNS and cannot
      be set through the API.
  - code: UpstreamConfFormatError
    status: 400
    api: NGINX Plus REST API
    title: Upstream configuration format error
    detail: The request body named an unknown parameter, omitted the required "server" argument,
      or nested objects where a flat object was expected.
  - code: UpstreamBadAddress
    status: 400
    api: NGINX Plus REST API
    title: Invalid upstream server address
  - code: UpstreamBadServerId
    status: 400
    api: NGINX Plus REST API
    title: Invalid upstream server ID
  - code: UpstreamBadWeight
    status: 400
    api: NGINX Plus REST API
    title: Invalid weight value
  - code: UpstreamBadMaxConns
    status: 400
    api: NGINX Plus REST API
    title: Invalid max_conns value
  - code: UpstreamBadMaxFails
    status: 400
    api: NGINX Plus REST API
    title: Invalid max_fails value
  - code: UpstreamBadFailTimeout
    status: 400
    api: NGINX Plus REST API
    title: Invalid fail_timeout value
  - code: UpstreamBadSlowStart
    status: 400
    api: NGINX Plus REST API
    title: Invalid slow_start value
  - code: UpstreamBadRoute
    status: 400
    api: NGINX Plus REST API
    title: Invalid route
    detail: The route value is empty or longer than NGINX permits.
  - code: UpstreamBadService
    status: 400
    api: NGINX Plus REST API
    title: Invalid service value
    detail: The SRV service name is empty or malformed.
  - code: UpstreamConfNoResolver
    status: 400
    api: NGINX Plus REST API
    title: No resolver defined
    detail: A hostname was supplied but the upstream block has no resolver to resolve it with.
    remediation: Add a `resolver` directive to the enclosing http or stream block.
  - code: UpstreamNoBackup
    status: 400
    api: NGINX Plus REST API
    title: Upstream has no backup servers
  - code: UpstreamOutOfMemory
    status: 400
    api: NGINX Plus REST API
    title: Upstream shared memory exhausted
    remediation: Increase the size of the upstream's shared memory `zone`. NGINX Plus R37 added
      roughly 1KB per upstream server for response-time histograms, so zones sized before R37 may
      need a 25-30% increase.
  - code: KeyvalNotFound
    status: 404
    api: NGINX Plus REST API
    title: Keyval zone not found
  - code: KeyvalKeyNotFound
    status: 404
    api: NGINX Plus REST API
    title: Keyval key not found
  - code: KeyvalKeyExists
    status: 409
    api: NGINX Plus REST API
    title: Keyval key already exists
    remediation: Use PATCH to update an existing key; POST only creates.
  - code: KeyvalFormatError
    status: 400
    api: NGINX Plus REST API
    title: Keyval format error
    detail: Invalid JSON, invalid key format, a missing key, more than one key in a single
      create/update, or a timeout supplied when keyval timeout is not enabled on the zone.
  - code: EntryExists
    status: 409
    api: NGINX Plus REST API
    title: Entry already exists
  - code: CacheNotFound
    status: 404
    api: NGINX Plus REST API
    title: Cache zone not found
  - code: LocationZoneNotFound
    status: 404
    api: NGINX Plus REST API
    title: Location zone not found
  - code: ServerZoneNotFound
    status: 404
    api: NGINX Plus REST API
    title: Server zone not found
  - code: SlabNotFound
    status: 404
    api: NGINX Plus REST API
    title: Slab zone not found
  - code: ResolverZoneNotFound
    status: 404
    api: NGINX Plus REST API
    title: Resolver zone not found
  - code: LimitConnNotFound
    status: 404
    api: NGINX Plus REST API
    title: limit_conn zone not found
  - code: LimitReqNotFound
    status: 404
    api: NGINX Plus REST API
    title: limit_req zone not found
  - code: WorkerNotFound
    status: 404
    api: NGINX Plus REST API
    title: Worker process not found
  - code: BodyReadError
    status: 400
    api: NGINX Plus REST API
    title: Request body could not be read
  - code: JsonError
    status: 415
    api: NGINX Plus REST API
    title: Unsupported media type / JSON error
    remediation: Send Content-Type application/json with a well-formed JSON body.
  - code: null
    status: 413
    api: NGINX Plus REST API
    title: Request entity too large
    detail: This is the only 4xx in the NGINX Plus contract with no internal error code attached.
  - code: null
    status: 422
    api: F5 BIG-IP AS3
    title: Declaration failed validation
    detail: AS3 returns 422 when the declaration is syntactically valid JSON but fails AS3 schema
      or semantic validation.
    remediation: Re-send with controls.dryRun=true to run the full validation chain without
      touching the device, and read the per-tenant results array.
  - code: null
    status: 503
    api: F5 BIG-IP AS3
    title: Service unavailable / restnoded busy
    detail: AS3 returns 503 while another declaration is being processed or the restnoded worker
      is restarting.
    remediation: Retry with backoff, or POST with ?async=true and poll GET /task.
