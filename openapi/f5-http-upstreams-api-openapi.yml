      items:
        $ref: '#/components/schemas/NginxHTTPUpstreamPeer'
    NginxHTTPUpstreamPeer:
      title: HTTP Upstream Server
      type: object
      properties:
        id:
          type: integer
          description: The ID of the server.
          readOnly: true
        server:
          type: string
          description: An  <a href="https://nginx.org/en/docs/http/ngx_http_upstream_module.html#server">address</a> of the server.
        service:
          type: string
          description: The <a href="https://nginx.org/en/docs/http/ngx_http_upstream_module.html#service">service</a> parameter value of the <a href="https://nginx.org/en/docs/http/ngx_http_upstream_module.html#server">server</a> directive.
        name:
          type: string
          description: The name of the server specified in the <a href="https://nginx.org/en/docs/http/ngx_http_upstream_module.html#server">server</a> directive.
          readOnly: true
        backup:
          type: boolean
          description: A boolean value indicating whether the server is a <a href="https://nginx.org/en/docs/http/ngx_http_upstream_module.html#backup">backup</a> server.
        weight:
          type: integer
          description: <a href="https://nginx.org/en/docs/http/ngx_http_upstream_module.html#weight">Weight</a> of the server.
        state:
          type: string
          enum:
          - up
          - draining
          - down
          - unavail
          - checking
          - unhealthy
          description: Current state, which may be one of “<code>up</code>”, “<code>draining</code>”, “<code>down</code>”, “<code>unavail</code>”, “<code>checking</code>”, and “<code>unhealthy</code>”.
        active:
          type: integer
          description: The current number of active connections.
          readOnly: true
        ssl:
          type: object
          readOnly: true
          properties:
            handshakes:
              type: integer
              description: The total number of successful SSL handshakes.
              readOnly: true
            handshakes_failed:
              type: integer
              description: The total number of failed SSL handshakes.
              readOnly: true
            session_reuses:
              type: integer
              description: The total number of session reuses during SSL handshake.
              readOnly: true
            no_common_protocol:
              type: integer
              description: The number of SSL handshakes failed because of no common protocol.
            handshake_timeout:
              type: integer
              description: The number of SSL handshakes failed because of a timeout.
            peer_rejected_cert:
              type: integer
              description: The number of failed SSL handshakes when nginx presented the certificate to the upstream server but it was rejected with a corresponding alert message.
            verify_failures:
              type: object
              description: SSL certificate verification errors
              properties:
                expired_cert:
                  type: integer
                  description: An expired or not yet valid certificate was presented by an upstream server.
                revoked_cert:
                  type: integer
                  description: A revoked certificate was presented by an upstream server.
                hostname_mismatch:
                  type: integer
                  description: Server's certificate doesn't match the hostname.
                other:
                  type: integer
                  description: Other SSL certificate verification errors.
        max_conns:
          type: integer
          description: The <a href="https://nginx.org/en/docs/http/ngx_http_upstream_module.html#max_conns">max_conns</a> limit for the server.
        requests:
          type: integer
          description: The total number of client requests forwarded to this server.
          readOnly: true
        responses:
          type: object
          readOnly: true
          properties:
            1xx:
              type: integer
              description: The number of responses with “<code>1xx</code>” status codes.
              readOnly: true
            2xx:
              type: integer
              description: The number of responses with “<code>2xx</code>” status codes.
              readOnly: true
            3xx:
              type: integer
              description: The number of responses with “<code>3xx</code>” status codes.
              readOnly: true
            4xx:
              type: integer
              description: The number of responses with “<code>4xx</code>” status codes.
              readOnly: true
            5xx:
              type: integer
              description: The number of responses with “<code>5xx</code>” status codes.
              readOnly: true
            codes:
              type: object
              description: The number of responses per each status code.
              readOnly: true
              properties:
                codeNumber:
                  type: integer
                  description: The number of responses with this particular status code.
                  readOnly: true
            total:
              type: integer
              description: The total number of responses obtained from this server.
              readOnly: true
        sent:
          type: integer
          description: The total number of bytes sent to this server.
          readOnly: true
        received:
          type: integer
          description: The total number of bytes received from this server.
          readOnly: true
        fails:
          type: integer
          description: The total number of unsuccessful attempts to communicate with the server.
          readOnly: true
        unavail:
          type: integer
          description: How many times the server became unavailable for client requests (state “<code>unavail</code>”) due to the number of unsuccessful attempts reaching the <a href="https://nginx.org/en/docs/http/ngx_http_upstream_module.html#max_fails">max_fails</a> threshold.
          readOnly: true
        health_checks:
          type: object
          readOnly: true
          properties:
            checks:
              type: integer
              description: The total number of <a href="https://nginx.org/en/docs/http/ngx_http_upstream_hc_module.html#health_check">health check</a> requests made.
            fails:
              type: integer
              description: The number of failed health checks.
            unhealthy:
              type: integer
              description: How many times the server became unhealthy (state “<code>unhealthy</code>”).
            last_passed:
              type: boolean
              description: Boolean indicating if the last health check request was successful and passed <a href="https://nginx.org/en/docs/http/ngx_http_upstream_hc_module.html#match">tests</a>.
        downtime:
          type: integer
          readOnly: true
          description: Total time the server was in the “<code>unavail</code>”, “<code>checking</code>”, and “<code>unhealthy</code>” states.
        downstart:
          type: string
          format: date-time
          readOnly: true
          description: The time when the server became “<code>unavail</code>”, “<code>checking</code>”, or “<code>unhealthy</code>”, in the ISO 8601 format with millisecond resolution.
        selected:
          type: string
          format: date-time
          readOnly: true
          description: The time when the server was last selected to process a request, in the ISO 8601 format with millisecond resolution.
        header_time:
          type: integer
          readOnly: true
          description: The average time to get the <a href="https://nginx.org/en/docs/http/ngx_http_upstream_module.html#var_upstream_header_time">response header</a> from the server.
        response_time:
          type: integer
          readOnly: true
          description: The average time to get the <a href="https://nginx.org/en/docs/http/ngx_http_upstream_module.html#var_upstream_response_time">full response</a> from the server.
        response_time_hist:
          type: object
          description: Histogram of upstream response times collected per upstream server.
          readOnly: true
          properties:
            count:
              type: integer
              description: Total number of recorded responses.
              readOnly: true
            sum:
              type: integer
              description: Sum of all recorded upstream response times, in milliseconds.
              readOnly: true
            buckets:
              title: Histogram bucket counters
              description: 'Histogram bucket counters for upstream response times, in milliseconds.

                Each bucket name ("5","10","25","50", etc.) is a time limit in milliseconds.

                Each bucket value is the number of responses within that time bucket.

                The "inf" bucket counts responses greater than 10000 ms.

                '
              type: object
              readOnly: true
              properties:
                '5':
                  type: integer
                  description: The total number of responses with response time less than or equal to 5 ms.
                '10':
                  type: integer
                  description: The total number of responses with response time greater than 5 ms and less than or equal to 10 ms.
                '25':
                  type: integer
                  description: The total number of responses with response time greater than 10 ms and less than or equal to 25 ms.
                '50':
                  type: integer
                  description: The total number of responses with response time greater than 25 ms and less than or equal to 50 ms.
                '75':
                  type: integer
                  description: The total number of responses with response time greater than 50 ms and less than or equal to 75 ms.
                '100':
                  type: integer
                  description: The total number of responses with response time greater than 75 ms and less than or equal to 100 ms.
                '250':
                  type: integer
                  description: The total number of responses with response time greater than 100 ms and less than or equal to 250 ms.
                '500':
                  type: integer
                  description: The total number of responses with response time greater than 250 ms and less than or equal to 500 ms.
                '750':
                  type: integer
                  description: The total number of responses with response time greater than 500 ms and less than or equal to 750 ms.
                '1000':
                  type: integer
                  description: The total number of responses with response time greater than 750 ms and less than or equal to 1000 ms.
                '2500':
                  type: integer
                  description: The total number of responses with response time greater than 1000 ms and less than or equal to 2500 ms.
                '5000':
                  type: integer
                  description: The total number of responses with response time greater than 2500 ms and less than or equal to 5000 ms.
                '7500':
                  type: integer
                  description: The total number of responses with response time greater than 5000 ms and less than or equal to 7500 ms.
                '10000':
                  type: integer
                  description: The total number of responses with response time greater than 7500 ms and less than or equal to 10000 ms.
                inf:
                  type: integer
                  description: The total number of observations with response time greater than 10000 ms.
