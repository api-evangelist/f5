specification: API Commons ChangeLog
specificationVersion: '0.1'
provider: F5
providerId: f5
generated: '2026-09-07'
method: searched
source: https://docs.nginx.com/nginx/releases/
description: >-
  F5's dated, public, machine-locatable change record. There is no single F5-wide API changelog;
  the surface that actually publishes dated release notes on a cadence is NGINX Plus, and the
  BIG-IP Automation Toolchain extensions publish theirs as GitHub releases. The recent NGINX Plus
  window matters to an API consumer for one specific reason: PLS.37 changed a default that alters
  how NGINX talks to upstreams, which is a behavioural break for anyone whose backends do not
  handle connection reuse.
scheme: >-
  NGINX Plus uses two parallel tracks. Continuous Release (CR) versions carry new features
  (PLS.37.1.0.1); Long-Term Support (LTS) versions in the same major receive bugfix and security
  patches only (PLS.37.0.5.1). The older R-numbered scheme (R36 Pn) is still patched in parallel.
current_version: PLS.37.1.0.1 CR
current_version_date: '2026-09-02'
lts_version: PLS.37.0.5.1 LTS
lts_version_date: '2026-09-02'
