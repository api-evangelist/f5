trial:
  available: true
  length_days: 30
  description: >-
    "Get a free 30-day trial to see how F5 products and services work with your apps, in your
    environment." — https://www.f5.com/products/get-f5
  url: https://www.f5.com/products/get-f5
  self_serve: partial
  note: >-
    F5 Distributed Cloud offers self-service tenant signup at
    https://console.ves.volterra.io/signup/account (the vesctl README names it as the prerequisite
    for API credentials), which is the closest thing in the estate to self-serve onboarding. BIG-IP
    and NGINX Plus trials route through a form.
free_tier:
  available: false
  note: >-
    No free tier is published for any F5 product API. NGINX Open Source is free and open source
    software, but it is not an F5 API product and it does not include the NGINX Plus REST API —
    the /api endpoint is a NGINX Plus feature.
api_pricing:
  metered: false
  note: >-
    None of F5's APIs are separately priced or metered. The BIG-IP management APIs (iControl REST,
    AS3, FAST, DO) and the NGINX Plus REST API are included capabilities of a product licence and
    run on the customer's own instance, so there is no per-call price and no quota to buy. F5
    Distributed Cloud and NGINX One are licensed by consumption of the underlying service, not by
    API call.
findings:
  - No dollar amount for any F5 or NGINX product appears on any f5.com page probed on 2026-09-07.
  - www.nginx.com/pricing, the historical NGINX pricing page, now 301-redirects to
    www.f5.com/products/get-f5, which carries no prices at all — the NGINX per-instance list price
    that circulated publicly before the F5 acquisition is no longer published by the vendor.
  - Third-party marketplaces quote NGINX Plus figures, but nothing F5 publishes corroborates them
    and none are recorded here.
