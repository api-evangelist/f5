source: >-
  https://www.f5.com/products/get-f5 (200, fetched 2026-09-07) — the page F5 routes every pricing
  enquiry to; https://www.nginx.com/pricing 301-redirects to it. https://www.f5.com/pricing and
  https://www.f5.com/products/pricing both return 404. https://www.f5.com/go/faq/nginx-faq for the
  NGINX One purchasing model.
tags:
  - Applications
