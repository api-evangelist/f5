description: >-
  F5 publishes no prices. This record exists to state that clearly rather than to omit the file,
  and it replaces a scaffold written by the 2026-05-04 bulk sweep that invented a free tier with a
  1,000-request monthly quota and a 10-requests-per-minute rate limit. None of those numbers came
  from F5 and none of them are true. What F5 actually publishes is a set of purchasing MODELS with
  no amounts attached, plus a 30-day free trial.
